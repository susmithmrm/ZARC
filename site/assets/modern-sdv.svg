<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 942" role="img" aria-labelledby="title desc">
<title id="title">ZARC modern vehicle reference architecture</title>
<desc id="desc">A central application processor hosts SDV Core, cockpit, optional compute services and a trusted ZARC Host broker. The broker uses a selected UART or IPC link to an independent companion controller and a switched Ethernet network to four ZARC zonal controllers. Zones own allocated local devices and can connect to intelligent edge nodes and legacy ECUs. An optional integrated real-time core is an alternative allocation, not a second device owner. Cloud services provide managed updates and telemetry, not direct physical commands.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#80d9d0"/></marker></defs>
<style>
text{font-family:Inter,Arial,sans-serif;fill:#eaf5f6}
.head{font-size:17px;font-weight:700}.title{font-size:24px;font-weight:750}.label{font-size:13px;font-weight:600}.small{font-size:12px;fill:#b7cfd4}.micro{font-size:10px;fill:#aac1cb;letter-spacing:1px}.accent{font-size:15px;font-weight:700;fill:#77f1d5}.bg{fill:#081f2b}.frame{fill:#0f2b38;stroke:#456674;stroke-width:1.4}.card{fill:#183946;stroke:#557684;stroke-width:1}.zarc{fill:#123e43;stroke:#63d9c4;stroke-width:1.6}.device{fill:#132f3b;stroke:#52717c;stroke-width:1}.bus{fill:#1c4351;stroke:#72b1bb;stroke-width:1.3}.optional{fill:#132f3b;stroke:#9fb9c1;stroke-width:1.2;stroke-dasharray:6 4}.data,.trunk{fill:none;stroke:#80d9d0;stroke-width:2;stroke-linejoin:round}.trunk{stroke-width:3}.dash{fill:none;stroke:#91aeb7;stroke-width:1.7;stroke-dasharray:7 5}
</style>
