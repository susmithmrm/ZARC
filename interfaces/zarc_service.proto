syntax = "proto3";
package zarc.reference.v1;

// Candidate semantic schema, independent of transport or OEM VSIDL mapping.
enum Status {
  ACCEPTED = 0;
  COMPLETED = 1;
  DENIED = 2;
  BUSY = 3;
  CONFLICT = 4;
  INVALID = 5;
  EXPIRED = 6;
  INCOMPATIBLE = 7;
  UNAVAILABLE = 8;
  UNKNOWN_OUTCOME = 9;
}
enum Indicator {
  INDICATOR_UNKNOWN = 0;
  INDICATOR_OFF = 1;
  INDICATOR_ON = 2;
  INDICATOR_FAULT = 3;
}
enum Quality {
  QUALITY_UNKNOWN = 0;
  QUALITY_VALID = 1;
  QUALITY_STALE = 2;
  QUALITY_FAULT = 3;
}
message SnapshotRequest { uint32 capability = 1; }
message Intent {
  uint32 capability = 1;
  Indicator desired = 2;
  uint32 validity_ms = 3;
}
message Admission {
  optional Status status = 1;
  uint64 request_id = 2;
  uint64 boot = 3;
  uint64 session = 4;
}
message RequestStatusQuery {
  uint32 capability = 1;
  uint64 request_id = 2;
  uint64 boot = 3;
  uint64 session = 4;
}
message RequestOutcome { optional Status status = 1; }
message Observation {
  optional Status status = 1;
  Indicator value = 2;
  Quality quality = 3;
  uint64 boot = 4;
  uint64 generation = 5;
}
message Health {
  optional Status status = 1;
  uint32 capability = 2;
  uint32 failures = 3;
  bool ready = 4;
  bool pending = 5;
  bool effect_owned = 6;
  uint64 sample_tick = 7;
  uint64 source_sequence = 8;
  uint64 boot = 9;
  uint64 session = 10;
}
enum UpdatePhase {
  UPDATE_ACTIVE = 0;
  UPDATE_STAGED = 1;
  UPDATE_TRIAL_REQUESTED = 2;
  UPDATE_TRIAL = 3;
  UPDATE_RECOVERY_REQUIRED = 4;
  UPDATE_UNAVAILABLE = 5;
  UPDATE_CONFIRMING = 6;
}
message UpdateStatusQuery {}
message UpdateStatus {
  optional Status status = 1;
  UpdatePhase phase = 2;
  uint64 revision = 3;
  uint64 active_image = 4;
  uint64 active_version = 5;
  uint64 candidate_image = 6;
  uint64 candidate_version = 7;
  uint64 sample_tick = 8;
  uint64 boot = 9;
  uint64 session = 10;
}
service IndicatorService {
  rpc GetUpdateStatus(UpdateStatusQuery) returns (UpdateStatus);
  rpc GetRequestStatus(RequestStatusQuery) returns (RequestOutcome);
  rpc GetHealth(SnapshotRequest) returns (Health);
  rpc GetSnapshot(SnapshotRequest) returns (Observation);
  rpc RequestState(Intent) returns (Admission);
}
