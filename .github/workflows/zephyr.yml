name: Native Zephyr CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-multilib g++-multilib device-tree-compiler gperf python3-venv
          python3 -m venv "$RUNNER_TEMP/zephyr-venv"
          echo "$RUNNER_TEMP/zephyr-venv/bin" >> "$GITHUB_PATH"
      - name: Set up pinned Zephyr
        run: |
          pip install west
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.2.0 "$RUNNER_TEMP/zephyr-workspace"
          cd "$RUNNER_TEMP/zephyr-workspace"
          west update --narrow
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt
          west manifest --freeze > "$GITHUB_WORKSPACE/zephyr-manifest-frozen.yml"
      - name: Run native simulator tests
        working-directory: ${{ runner.temp }}/zephyr-workspace
        run: west twister -T "$GITHUB_WORKSPACE/platform/zephyr" -p native_sim/native/64 --inline-logs -O "$GITHUB_WORKSPACE/twister-out"
      - name: Archive raw test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-native-evidence
          path: |
            zephyr-manifest-frozen.yml
            twister-out/twister.json
            twister-out/twister.log
            twister-out/**/handler.log
            twister-out/**/build.log
          if-no-files-found: warn
