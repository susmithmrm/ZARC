name: Native Zephyr CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-multilib g++-multilib device-tree-compiler gperf python3-venv
          python3 -m venv "$RUNNER_TEMP/zephyr-venv"
          echo "$RUNNER_TEMP/zephyr-venv/bin" >> "$GITHUB_PATH"
      - name: Set up pinned Zephyr
        run: |
          pip install west
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.2.0 "$RUNNER_TEMP/zephyr-workspace"
          cd "$RUNNER_TEMP/zephyr-workspace"
          west update --narrow
          git -C zephyr rev-parse HEAD > "$GITHUB_WORKSPACE/zephyr-revision.txt"
          west zephyr-export
          pip install -r zephyr/scripts/requirements.txt
          west manifest --freeze --active-only > "$GITHUB_WORKSPACE/zephyr-manifest-frozen.yml"
      - name: Apply simulator-only UART ownership correction
        working-directory: ${{ runner.temp }}/zephyr-workspace
        run: |
          python "$GITHUB_WORKSPACE/tools/patch_uart_emulator.py" zephyr
          git -C zephyr diff --check
          git -C zephyr diff -- drivers/serial/uart_emul.c > "$GITHUB_WORKSPACE/zephyr-simulator.patch"
          test -s "$GITHUB_WORKSPACE/zephyr-simulator.patch"
      - name: Run native simulator tests
        working-directory: ${{ runner.temp }}/zephyr-workspace
        run: west twister -T "$GITHUB_WORKSPACE/platform/zephyr" -p native_sim/native/64 --inline-logs -O "$GITHUB_WORKSPACE/twister-out"
      - name: Collect exact source and build inventory
        run: python tools/build_evidence.py --build twister-out --configuration native_sim-native-64 --out native-build-evidence.json
      - name: Archive raw test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-native-evidence
          path: |
            native-build-evidence.json
            zephyr-revision.txt
            zephyr-simulator.patch
            zephyr-manifest-frozen.yml
            twister-out/twister.json
            twister-out/twister.log
            twister-out/**/handler.log
            twister-out/**/build.log
            twister-out/**/zephyr/.config
            twister-out/**/zephyr/zephyr.dts
            twister-out/**/zephyr/zephyr.map
          if-no-files-found: warn
