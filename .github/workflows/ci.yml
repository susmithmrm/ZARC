name: Desktop CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        config: [Debug, Release]
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python docs/verify_baseline.py
      - run: python docs/verify_documentation.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
      - run: cmake --build build --config ${{ matrix.config }}
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --output-junit ctest.xml

      - name: Collect exact source and build inventory
        run: python tools/build_evidence.py --build build --configuration ${{ matrix.os }}-${{ matrix.config }} --out build-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-evidence-${{ matrix.os }}-${{ matrix.config }}
          path: |
            build-evidence.json
            build/ctest.xml
          if-no-files-found: warn
