name: Publish ZARC Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate static reference assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from xml.etree import ElementTree
          from urllib.parse import urlsplit
          class Links(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in ('href', 'src') and value:
                          parsed = urlsplit(value)
                          if not parsed.scheme and not parsed.netloc and parsed.path:
                              assert (self.page.parent / parsed.path).is_file(), (self.page, value)
          for page in Path('site').rglob('*.html'):
              parser = Links()
              parser.page = page
              parser.feed(page.read_text(encoding='utf-8'))
          for svg in Path('site').rglob('*.svg'):
              ElementTree.parse(svg)
          print('Static HTML links and SVG XML passed')
          PY
      - name: Verify sedan renderer and controls
        run: |
          node --check site/sedan.js
          node tests/sedan_renderer_test.cjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Confirm uploaded artifact is visible to deployment API
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          for attempt in $(seq 1 12); do
            if response=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -f name="$ARTIFACT_NAME"); then
              if jq -e --arg name "$ARTIFACT_NAME" --arg id "$ARTIFACT_ID" '
                [.artifacts[] | select(.name == $name)] as $matches |
                ($matches | length) == 1 and
                ($matches[0].id | tostring) == $id and
                ($matches[0].expired == false)
              ' <<< "$response" > /dev/null; then
                echo "Confirmed unique artifact $ARTIFACT_ID for this attempt."
                exit 0
              fi
            fi
            echo "Artifact metadata not yet available (check $attempt/12)."
            if [ "$attempt" -lt 12 ]; then sleep 5; fi
          done
          echo "::error::Expected unique, unexpired Pages artifact was not visible."
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
